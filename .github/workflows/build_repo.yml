name: Build Kodi repo

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [addon-updated]
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update submodules to latest
        run: git submodule update --remote

      - name: Build repo
        run: python3 tools/build_repo.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add addons docs
          git diff --cached --quiet || git commit -m "Rebuild repo"
          git push
